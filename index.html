<body><div class="app"><header class="top"><div class="topline"><span class="eyebrow">MY DAY PLANNER</span><span class="avatar">🌱</span></div><h1>おはよう！</h1><div class="date">今日やることを確認しよう</div><div class="summary"><div class="pill"><b id="remaining">0</b>残っていること</div><div class="pill"><b id="completed">0</b>完了</div></div></header><main id="plannerPage"><div class="date-label">カレンダー</div><section class="calendar" aria-label="カレンダー"><div class="cal-head"><button class="cal-nav" id="prevMonth" aria-label="前の月">‹</button><strong id="monthTitle"></strong><div class="cal-controls"><button class="cal-view active" data-view="month">月</button><button class="cal-view" data-view="week">週</button><button class="cal-view" data-view="day">日</button></div><button class="cal-nav" id="nextMonth" aria-label="次の月">›</button></div><button class="export-cal" id="exportCalendar">Appleカレンダー用に書き出す</button><div class="cal-grid" id="calendarGrid"></div></section><div class="section-head"><h2><button type="button" id="todayListToggle" class="today-heading-toggle" aria-expanded="true" onclick="todayExpanded=!todayExpanded;renderTaskLists()"><span id="todayHeadingLabel">今日のリスト</span><span id="todayHeadingChevron">−</span></button></h2><span class="link" id="filter">すべて</span></div><div class="section-head" style="margin:0 0 12px"><select id="subjectFilter" aria-label="科目で絞り込む" style="padding:8px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)"><option value="">すべての科目</option></select><div style="display:flex;gap:7px;flex-wrap:wrap"><button id="consultChatGPT" class="export-cal" style="margin:0">ChatGPTに相談</button><button id="shareSelected" class="export-cal" style="margin:0">選んだ課題を共有</button></div></div><div class="date-label" id="listDateLabel">今日</div><div id="list"></div><div class="empty" id="empty" style="display:block">予定はまだありません。<br>「＋ 新しい予定を追加」から入力してください。</div><div class="date-label">使い方</div><div style="font-size:13px;color:#758099;line-height:1.7">予定や課題、To Doを自由に追加できます。<br>内容・種類・日付を入力して、自分用のリストを作りましょう。</div></main><main id="timetablePage" hidden><div class="timetable-head"><h2>学校の時間割</h2><div class="timetable-head-actions"><select id="timetableSelect" class="timetable-select" aria-label="時間割表を選択"></select><button type="button" id="addTimetable" class="add-timetable" aria-label="時間割表を追加" title="時間割表を追加">＋</button></div></div><p class="timetable-help">マスをタップして授業を登録できます。右上の＋から、時間割表を最大8つ追加できます。</p><section class="term-range" aria-label="時間割の適用期間"><div class="term-range-title">この時間割を使う期間</div><div class="term-range-inputs"><label for="timetableRangeFrom">開始日<input id="timetableRangeFrom" type="date"></label><span>～</span><label for="timetableRangeTo">終了日<input id="timetableRangeTo" type="date"></label></div><div class="term-range-footer"><span class="term-range-summary" id="timetableRangeSummary">すべての期間で表示</span><button class="term-range-save" id="saveTimetableRange" type="button">期間を保存</button></div><p class="term-range-note">指定した期間だけ、授業をカレンダーと予定リストに表示します。空欄は期間の制限なしです。</p></section><div class="table-wrap"><table class="timetable" id="timetable"></table></div></main><button type="button" class="add" id="add" onclick="document.getElementById('modal').classList.add('open')">＋ 新しい予定を追加</button><nav class="bottom-nav"><button type="button" id="plannerTab" class="active" onclick="document.getElementById('plannerPage').hidden=false;document.getElementById('timetablePage').hidden=true;document.getElementById('add').hidden=false;document.getElementById('plannerTab').classList.add('active');document.getElementById('timetableTab').classList.remove('active');document.getElementById('modal').classList.remove('open');document.getElementById('timetableModal').classList.remove('open');document.documentElement.scrollTop=0;document.body.scrollTop=0">📅 予定</button><button type="button" id="timetableTab" onclick="document.getElementById('plannerPage').hidden=true;document.getElementById('timetablePage').hidden=false;document.getElementByI
